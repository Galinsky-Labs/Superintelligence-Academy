# Render Blueprint for Academy (Next.js). The engine is a separate service (Superintelligence-Engine).
services:
  - type: web
    name: superintelligence-academy
    runtime: node
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: git submodule update --init && npm install --no-audit --no-fund && npm run build
    startCommand: npm run start:render -- -p $PORT
    healthCheckPath: /api/health
    envVars:
      - {key: NODE_VERSION, value: "22"}
      - {key: NEXT_TELEMETRY_DISABLED, value: "1"}
      - {key: ENGINE_API_URL, sync: false}               # server-side engine base URL
      - {key: ACADEMY_DATABASE_URL, sync: false}         # Neon (pooled host) for learning records
      - {key: SIA_EDITOR_IDENTITY_IDS, sync: false}      # comma-separated engine identity ids of editors
      - {key: SIA_SESSION_SECRET, sync: false}           # 64 hex chars; seals the session cookie
      - {key: NEXT_PUBLIC_ENGINE_ORIGIN, sync: false}    # browser-visible engine origin (build time)
      - {key: NEXT_PUBLIC_COMMAND_ORIGIN, sync: false}   # companion app origin (build time)
